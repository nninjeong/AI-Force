<template>
    <lightning-card title="내 작업 목록 (기술자)" icon-name="standard:service_appointment">
        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>

            <template if:true={jobs.data}>
                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">접수 번호</th>
                            <th scope="col">고객명</th>
                            <th scope="col">상태</th>
                            <th scope="col">작업</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={jobs.data} for:item="job">
                            <tr key={job.Id}>
                                <td>{job.Name}</td>
                                <td>{job.CustomerName__c}</td>
                                <td><lightning-badge label={job.Status__c}></lightning-badge></td>
                                <td>
                                    <lightning-button-group>
                                        <lightning-button label="진단 입력" variant="brand" 
                                                          onclick={handleDiagnose} data-id={job.Id}></lightning-button>
                                        <lightning-button label="완료 처리" variant="success" 
                                                          onclick={handleComplete} data-id={job.Id}></lightning-button>
                                    </lightning-button-group>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template if:false={jobs.data}>
                <p>배정된 작업이 없습니다.</p>
            </template>
        </div>
    </lightning-card>

    <!-- 진단 입력 모달 -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">수리 진단 및 견적 입력</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea label="진단 결과" onchange={handleResultChange} required></lightning-textarea>
                    <lightning-input type="number" label="예상 비용" formatter="currency" onchange={handleCostChange} required></lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="취소" onclick={closeModal} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="저장 및 상태 업데이트" variant="brand" onclick={saveDiagnosis}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
